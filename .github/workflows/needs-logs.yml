# Log check for bug reports: a bug report without dlaa_inject.log gets the labels "needs-logs" + "needs-info" and one
# comment that asks for the files (needs-info.yml then reminds / closes it as for any issue that waits for the reporter).
#   - issue opened or edited     : the body is checked
#   - anyone comments            : the body + every non-maintainer comment are checked; with a log, "needs-logs" is removed
#   - workflow_dispatch          : every open bug report is checked (the comment is still written only once per issue)
# Once "needs-logs" is on, only a log posted AFTER it was last added ends the wait: a reporter's comment, or the reporter's
# own edit of the body. An old log in the body (a moved issue lists the reporter's earlier log) does not count again.
# A log counts when the text has an attached .log / .txt / .zip / .7z / .rar file, a link to such a file or to a file-share
# site (Google Drive, Dropbox, OneDrive, MEGA, WeTransfer, Synology QuickConnect, gist, pastebin), or the pasted
# "DLAA injector v... loaded" line.
# Feature requests and pull requests are not checked. On an issue the maintainer opened (moved from Discussions) the bot
# never asks, but it still removes "needs-logs" once a log is there.
name: Needs-logs check

on:
  issues:
    types: [opened, edited, labeled]
  issue_comment:
    types: [created]
  workflow_dispatch:

permissions:
  issues: write

jobs:
  check:
    if: github.event_name == 'workflow_dispatch' || !github.event.issue.pull_request
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const MARK = '<!-- needs-logs-bot -->';
            const LOG_RE = [                                // the same test as needs-info.yml
              /user-attachments\/(files|assets)\/\d+\/[^\s)\]]*\.(log|txt|zip|7z|rar)\b/i,
              /\[[^\]]*dlaa_inject[^\]]*\]\(http/i,
              /https?:\/\/[^\s)\]]+\.(log|txt|zip|7z|rar)\b/i,
              /https?:\/\/[^\s)\]]*(drive\.google\.com|dropbox\.com|1drv\.ms|onedrive\.live\.com|sharepoint\.com|mega\.nz|we\.tl|wetransfer\.com|quickconnect\.to|gist\.github\.com|pastebin\.com)/i,
              /DLAA injector v[0-9][^\n]*loaded/i,
            ];
            const hasLog = t => !!t && LOG_RE.some(r => r.test(t));
            const { owner, repo } = context.repo;

            async function check(issue) {
              const labels = issue.labels.map(l => typeof l === 'string' ? l : l.name);
              const isBug = labels.includes('bug') || /^\s*\[bug\]/i.test(issue.title);
              if (!isBug || issue.pull_request || issue.state !== 'open') return;
              const MAINT = ['OWNER', 'MEMBER', 'COLLABORATOR'];
              const byMaint = MAINT.includes(issue.author_association);

              const comments = await github.paginate(github.rest.issues.listComments,
                { owner, repo, issue_number: issue.number, per_page: 100 });
              const n = issue.number;
              // the wait starts when "needs-logs" was last added: only a log posted after that ends it
              const events = await github.paginate(github.rest.issues.listEventsForTimeline,
                { owner, repo, issue_number: n, per_page: 100 });
              let since = 0;
              for (const e of events) if (e.event === 'labeled' && e.label && e.label.name === 'needs-logs')
                since = Math.max(since, Date.parse(e.created_at));
              const p = context.payload;
              const bodyCounts = !since || (context.eventName === 'issues' && p.action === 'edited' && !byMaint &&
                                            p.sender && p.sender.login === issue.user.login);
              const texts = [bodyCounts ? issue.body : '', ...comments.filter(c => !MAINT.includes(c.author_association) &&
                c.user.type !== 'Bot' && Date.parse(c.created_at) > since).map(c => c.body)];

              if (texts.some(hasLog)) {
                if (labels.includes('needs-logs')) {
                  await github.rest.issues.removeLabel({ owner, repo, issue_number: n, name: 'needs-logs' }).catch(() => {});
                  core.info(`#${n}: log found, needs-logs removed`);
                }
                return;
              }
              if (labels.includes('needs-logs')) { core.info(`#${n}: still no log, already labelled`); return; }
              if (byMaint) return;                       // a moved issue: the maintainer asks by hand

              await github.rest.issues.addLabels({ owner, repo, issue_number: n, labels: ['needs-logs', 'needs-info'] });
              if (comments.some(c => c.body && c.body.includes(MARK))) return;
              await github.rest.issues.createComment({ owner, repo, issue_number: n, body: MARK + `
            Hi @${issue.user.login}, thanks a lot for reporting this! The mod is a free community project, and reports like yours are how it gets better for everyone.

            To find out what happens, I need your log file. It only takes a minute (the steps are also in the README, [Reporting a problem (what to upload)](https://github.com/${owner}/${repo}#reporting-a-problem-what-to-upload)):

            1. In \`dlaa.ini\` (next to \`dinput8.dll\` in the game's \`bin\\win_x64\\\` folder), change \`log_level = 1\` to \`log_level = 4\`.
            2. Start the game, load a save, and play for 1 to 2 minutes where the problem shows.
            3. Quit the game.
            4. Drag \`dlaa_inject.log\` and \`dlaa.ini\` into a comment here. (Attach them as files; please do not paste the text.)

            If there is no \`dlaa_inject.log\` at all, just tell me: then the mod did not load, and that is useful to know too. Thanks!` });
              core.info(`#${n}: no log, labelled and asked`);
            }

            if (context.eventName === 'workflow_dispatch') {
              const issues = await github.paginate(github.rest.issues.listForRepo,
                { owner, repo, state: 'open', labels: 'bug', per_page: 100 });
              for (const i of issues) await check(i);
            } else {
              const { data: issue } = await github.rest.issues.get({ owner, repo, issue_number: context.issue.number });
              await check(issue);
            }
