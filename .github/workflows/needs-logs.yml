# Log check for bug reports: a bug report without dlaa_inject.log gets the labels "needs-logs" + "needs-info" and one
# comment that asks for the files (needs-info.yml then reminds / closes it as for any issue that waits for the reporter).
#   - issue opened or edited     : the body is checked
#   - the reporter comments      : the body + all of the reporter's comments are checked; with a log, "needs-logs" is removed
#   - workflow_dispatch          : every open bug report is checked (the comment is still written only once per issue)
# A log counts when the text has an attached .log / .zip / .7z file, or the pasted "DLAA injector v... loaded" line.
# Feature requests, pull requests and issues opened by the maintainer are not checked.
name: Needs-logs check

on:
  issues:
    types: [opened, edited, labeled]
  issue_comment:
    types: [created]
  workflow_dispatch:

permissions:
  issues: write

jobs:
  check:
    if: github.event_name == 'workflow_dispatch' || !github.event.issue.pull_request
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const MARK = '<!-- needs-logs-bot -->';
            const LOG_RE = [
              /user-attachments\/(files|assets)\/\d+\/[^\s)\]]*\.(log|zip|7z|rar)\b/i,
              /\[[^\]]*dlaa_inject[^\]]*\]\(http/i,
              /DLAA injector v[0-9][^\n]*loaded/i,
            ];
            const hasLog = t => !!t && LOG_RE.some(r => r.test(t));
            const { owner, repo } = context.repo;

            async function check(issue) {
              const labels = issue.labels.map(l => typeof l === 'string' ? l : l.name);
              const isBug = labels.includes('bug') || /^\s*\[bug\]/i.test(issue.title);
              if (!isBug || issue.pull_request || issue.state !== 'open') return;
              if (['OWNER', 'MEMBER', 'COLLABORATOR'].includes(issue.author_association)) return;

              const comments = await github.paginate(github.rest.issues.listComments,
                { owner, repo, issue_number: issue.number, per_page: 100 });
              const texts = [issue.body, ...comments.filter(c => c.user.login === issue.user.login).map(c => c.body)];
              const n = issue.number;

              if (texts.some(hasLog)) {
                if (labels.includes('needs-logs')) {
                  await github.rest.issues.removeLabel({ owner, repo, issue_number: n, name: 'needs-logs' }).catch(() => {});
                  core.info(`#${n}: log found, needs-logs removed`);
                }
                return;
              }
              if (labels.includes('needs-logs')) { core.info(`#${n}: still no log, already labelled`); return; }

              await github.rest.issues.addLabels({ owner, repo, issue_number: n, labels: ['needs-logs', 'needs-info'] });
              if (comments.some(c => c.body && c.body.includes(MARK))) return;
              await github.rest.issues.createComment({ owner, repo, issue_number: n, body: MARK + `
            Thanks for the report. I cannot see a log file here, and without it I usually cannot tell what happened.

            Please follow the steps in the README, [Reporting a problem (what to upload)](https://github.com/${owner}/${repo}#reporting-a-problem-what-to-upload):

            1. In \`dlaa.ini\` (next to \`dinput8.dll\` in the game's \`bin\\win_x64\\\` folder), change \`log_level = 1\` to \`log_level = 4\`.
            2. Start the game, load a save, and drive for 1 to 2 minutes where the problem shows.
            3. Quit the game.
            4. Drag \`dlaa_inject.log\` and \`dlaa.ini\` into a comment here. (Attach them as files; do not paste the text.)

            If there is no \`dlaa_inject.log\` at all, please say so: then the mod did not load.` });
              core.info(`#${n}: no log, labelled and asked`);
            }

            if (context.eventName === 'workflow_dispatch') {
              const issues = await github.paginate(github.rest.issues.listForRepo,
                { owner, repo, state: 'open', labels: 'bug', per_page: 100 });
              for (const i of issues) await check(i);
            } else {
              const { data: issue } = await github.rest.issues.get({ owner, repo, issue_number: context.issue.number });
              await check(issue);
            }
