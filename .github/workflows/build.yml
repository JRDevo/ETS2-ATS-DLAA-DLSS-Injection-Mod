# Release build of dinput8.dll on a Windows runner.
#
# It mirrors the local build steps (clone the NVIDIA DLSS SDK, configure, build
# Release). Pinned to windows-2022: that image has Visual Studio 2022 and the
# Windows SDK (fxc, used by the embedded-shader validation); windows-latest no
# longer has a Visual Studio 17 2022 instance.
name: build

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Clone NVIDIA DLSS SDK
        run: git clone --depth 1 https://github.com/NVIDIA/DLSS external/DLSS

      - name: Configure (Release)
        run: cmake -B build -G "Visual Studio 17 2022" -A x64

      - name: Build (Release)
        run: cmake --build build --config Release

      - name: Upload dinput8.dll
        uses: actions/upload-artifact@v4
        with:
          name: dinput8-dll
          path: build/Release/dinput8.dll
          if-no-files-found: error

      # Unit tests on WARP (software D3D11, no GPU needed). The exe exits 1 when a check fails.
      # The .bat file only builds; the exe must exist, then it runs.
      # The LOD scope test builds inject.cpp WITHOUT WITH_DLAA and needs the configured build tree
      # (build\_deps\minhook-src, build\Release\minhook_static.lib): the Configure + Build steps above make it.
      - name: Build tests
        shell: cmd
        run: |
          call tests\build_drawid_harness.bat
          if not exist build\tests\drawid_harness.exe exit /b 1
          call tests\build_lod_scope_test.bat
          if not exist build\tests\lod_scope_test.exe exit /b 1
          call tests\build_mirror_turns_test.bat
          if not exist build\tests\mirror_turns_test.exe exit /b 1
          call tests\build_hidden_mask_test.bat
          if not exist build\tests\hidden_mask_test.exe exit /b 1
          call tests\build_cpu_tuning_test.bat
          if not exist build\tests\cpu_tuning_test.exe exit /b 1
          call tests\build_fps_pose_test.bat
          if not exist build\tests\fps_pose_test.exe exit /b 1
          call tests\build_menu_shot.bat
          if not exist build\tests\menu_shot.exe exit /b 1
          call tests\build_flat_views_test.bat
          if not exist build\tests\flat_views_test.exe exit /b 1
          call tests\build_fps_cab_test.bat
          if not exist build\tests\fps_cab_test.exe exit /b 1
          call tests\build_bias_mask_test.bat
          if not exist build\tests\bias_mask_test.exe exit /b 1
          call tests\build_hotkey_scan_test.bat
          if not exist build\tests\hotkey_scan_test.exe exit /b 1
          call tests\build_frame_pace_test.bat
          if not exist build\tests\frame_pace_test.exe exit /b 1

      - name: Test draw-id harness (did_shadow off)
        run: build\tests\drawid_harness.exe -1 0.1

      - name: Test draw-id harness (did_shadow on, the mod default)
        run: build\tests\drawid_harness.exe -1 0.1 didshadow=1 shverify=1

      - name: Test LOD bias scope (inject.cpp without WITH_DLAA)
        run: build\tests\lod_scope_test.exe

      - name: Test mirrors in turns (src/mirror_turns.h decisions)
        run: build\tests\mirror_turns_test.exe
      - name: Test VR hidden area mask (mapping, depth-only draw, state restore)
        run: build\tests\hidden_mask_test.exe
      - name: Test CPU tuning (src/cpu_tuning_pick.h P-core pick, narrowed-affinity rule)
        run: build\tests\cpu_tuning_test.exe
      - name: Test fps box pose (src/fps_pose.h colours, VR turn, distance shift)
        run: build\tests\fps_pose_test.exe
      - name: Test flat multi-view (src/flat_views.h layout, view index, confirm / drop, shared jitter phase)
        run: build\tests\flat_views_test.exe
      - name: Test fps box attached to the vehicle (src/fps_cab.h maths; DrawIdRecord + FpsCab + the VSCab draw, zero-lag cab sway)
        run: build\tests\fps_cab_test.exe
      - name: Test glow bias mask (phase 49 -- glow re-draw against the scene depth, share pass, crop step)
        run: build\tests\bias_mask_test.exe
      - name: Test hotkeys page (phase 50 / issue #16 -- fresh-press detector, held shifter gear, per-input hiding)
        run: build\tests\hotkey_scan_test.exe
      - name: Test frame pace (phase 52 -- flat limiter deadlines, FPS cap steps, VR FPS cap wait target)
        run: build\tests\frame_pace_test.exe
      - name: Smoke test menu_shot (renders the real tuning menu + fps box to PNG; outputs are not committed)
        shell: cmd
        run: |
          build\tests\menu_shot.exe build\menu_shot_out
          if errorlevel 1 exit /b 1
          for %%f in (tuning-menu tuning-menu-vr-performance tuning-menu-picture fps-counter fps-counter-colours) do if not exist build\menu_shot_out\%%f.png exit /b 1
